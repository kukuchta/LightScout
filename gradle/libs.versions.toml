# LightScout version catalog (CP-00 §2, CP-15 §8.7).
# Exact versions only: no "+", no ranges, no SNAPSHOT. Every entry is a library allowed by CP-00 §2.
# Any new entry needs a PO decision. Versions = latest stable on Google Maven / Maven Central on 2026-10-15.

[versions]
agp = "9.5.2"
appcompat = "1.8.0"
core = "1.19.1"
activity = "1.13.0"
fragment = "1.9.1"
lifecycle = "2.11.0"
navigation = "2.10.2"
constraintlayout = "2.2.2"
recyclerview = "1.4.0"
material = "1.14.0"
okhttp = "5.5.1"
orgJson = "20260814"
junit = "4.13.2"
androidxTestRunner = "1.7.0"
androidxTestCore = "1.7.0"
androidxTestExtJunit = "1.3.0"
espresso = "3.7.0"
uiautomator = "2.4.1"
benchmark = "1.5.0"

[libraries]
# Build logic only (build-logic/ convention plugin)
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }

# AndroidX (CP-00 §2 "AndroidX allowed"); no -ktx artifacts
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-core = { module = "androidx.core:core", version.ref = "core" }
androidx-activity = { module = "androidx.activity:activity", version.ref = "activity" }
androidx-fragment = { module = "androidx.fragment:fragment", version.ref = "fragment" }
androidx-lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel", version.ref = "lifecycle" }
androidx-lifecycle-livedata = { module = "androidx.lifecycle:lifecycle-livedata", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-savedstate = { module = "androidx.lifecycle:lifecycle-viewmodel-savedstate", version.ref = "lifecycle" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }
androidx-navigation-fragment = { module = "androidx.navigation:navigation-fragment", version.ref = "navigation" }
androidx-navigation-ui = { module = "androidx.navigation:navigation-ui", version.ref = "navigation" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }

# Material Components (M3)
material = { module = "com.google.android.material:material", version.ref = "material" }

# Third party: OkHttp 5 (:nightscout only)
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }

# Tests only
okhttp-mockwebserver3 = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }
org-json = { module = "org.json:json", version.ref = "orgJson" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
androidx-test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }
# Macrobenchmark (TST-10, IMPL Q-23)
androidx-benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "benchmark" }

[plugins]
# AGP is applied by the convention plugin "lightscout.module" (build-logic); these ids are listed for reference.
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
# Navigation Safe Args, Java generator (CP-00 §2 "navigation (XML + Safe Args Java)")
navigation-safeargs = { id = "androidx.navigation.safeargs", version.ref = "navigation" }
