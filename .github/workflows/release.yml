# Release: started by hand (Actions → Release → Run workflow). The version comes from gradle.properties
# (lightscout.versionName) and its notes from the matching "## [x.y.z]" section of CHANGELOG.md.
# "publish = false" only tests and builds an unsigned APK (artifact). "publish = true" also signs it with the release
# key, which lives in the protected environment "release" (each run waits for the maintainer's approval), and creates
# the tag vX.Y.Z and the GitHub release.
name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Sign and publish the release (tag vX.Y.Z and GitHub release)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: meta
        run: |
          VERSION=$(grep '^lightscout.versionName=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          grep -q "^## \[${VERSION}\]" CHANGELOG.md || { echo "CHANGELOG.md has no section ## [${VERSION}]"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build (unsigned)
        run: ./gradlew build :app:assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: LightScout-${{ steps.meta.outputs.version }}-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 14

  publish:
    if: ${{ inputs.publish }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the tag is new
        run: |
          TAG="v${{ needs.build.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" > /dev/null 2>&1; then
            echo "Tag ${TAG} already exists. Raise lightscout.versionName in gradle.properties first."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build signed release
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          LIGHTSCOUT_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          LIGHTSCOUT_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          LIGHTSCOUT_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export LIGHTSCOUT_RELEASE_STORE_FILE="$RUNNER_TEMP/release.jks"
          ./gradlew :app:assembleRelease --stacktrace
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ needs.build.outputs.version }}
          APK="LightScout-${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          sha256sum "$APK" > "$APK.sha256"
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          CERT=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/.*certificate SHA-256 digest: *//p' | head -1 | tr -d ' \r')
          awk -v v="$VERSION" 'index($0, "## [" v "]") == 1 {on=1; next} on && /^## \[/ {exit} on {print}' CHANGELOG.md > notes.md
          {
            echo
            echo "SHA-256 of the APK: \`$(cut -d' ' -f1 "$APK.sha256")\`"
            echo "Signing certificate SHA-256: \`${CERT}\`"
            echo
            echo "LightScout is not a medical device. Read the [medical disclaimer](https://github.com/${{ github.repository }}/blob/master/DISCLAIMER.md)."
          } >> notes.md
          git tag "v${VERSION}" HEAD
          git push origin "v${VERSION}"
          gh release create "v${VERSION}" "$APK" "$APK.sha256" --title "LightScout ${VERSION}" --notes-file notes.md
