# LightScout Gradle properties (no secrets here: test tokens only in git-ignored local.properties, SR-33).
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=false
android.useAndroidX=true
# AGP built-in Kotlin support disabled; no Kotlin plugin in any module (CP-00 §2, CP-15 §8.7).
# The convention plugin fails the build if this is not "false".
android.builtInKotlin=false

# Product base package = release applicationId and namespace root (PO decision D-051, IMPL Q-20).
lightscout.basePackage=app.lightscout
# SemVer versionName; versionCode = MAJOR*10000 + MINOR*100 + PATCH (CP-15 §8.6).
# Initial value 0.1.0 accepted by the Moderator (IMPL Q-24).
lightscout.versionName=0.1.0
